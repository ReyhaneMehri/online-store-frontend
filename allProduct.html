<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    
    <link href="./css/style.css" rel="stylesheet">
    <link href="./css/all.min.css" rel="stylesheet">
    <link href="./css/allProduct.css" rel="stylesheet">
    <link href="./css/responsive.css" rel="stylesheet">
    
</head>

<body>
    <header class="header">
        <div class="container-fluid">
            <div class="desktop-header">
                <div class="header-info">
                    <div class="logo">
                        <img src="./assets/image/logo.png">
                    </div>
                    <div class="search-box position-relative">
                        <i class="fa-solid fa-magnifying-glass position-absolute"></i>
                        <input type="search" id="search-input" class="form-control rounded-pill"
                            placeholder="جستجوی قهوه...">
                        <div id="search-result"></div>
                    </div>
                    <div class="menu-box">
                        <nav>
                            <ul class="menu">
                                <li><a href="index.html">
                                        <h6>خانه</h6>
                                    </a></li>
                                <li><a href="allProduct.html">
                                        <h6>فروشگاه</h6>
                                    </a></li>

                                <li class="dropdown ">
                                    <a href="#" class="align-items-center gap-1 d-flex flex-row-reverse">
                                        <h6>لورم</h6><i class="fa-solid fa-caret-down mb-1 me-1"></i>
                                    </a>
                                    <ul class="sub-menu">
                                        <li class="mx-5 pt-2"><a href="#">لورم</a></li>
                                        <li class="mx-5 pt-2"><a href="#">لورم</a></li>
                                        <li class="mx-5 pt-2"><a href="#">لورم</a></li>
                                    </ul>
                                </li>
                                <li><a href="index.html#about">
                                        <h6>درباره ما</h6>
                                    </a></li>
                            </ul>
                        </nav>

                    </div>
                    <div class="entrance">
                        <div class="shopping-icon">
                            <a href="./card.html">
                                <span class="cart-badge">0</span>
                                <i class="fa fa-shopping-cart fa-2x text-secondary text-opacity-50 mt-2"></i>
                            </a>
                        </div>
                        <div class="enter-btn">
                            <a href="./login.html">
                                <button class="btn-login text-white">ورود/ثبت نام</button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="mobile-header">

        <div class="col-sm-6">
            <div class="search-box position-relative w-100">
                <i class="fa-solid fa-magnifying-glass position-absolute"></i>
                <input type="search" id="search-input-mobile" class="form-control rounded-pill"
                    placeholder="جستجوی قهوه...">
                <div id="search-result"></div>
            </div>

        </div>
        <nav>
            <a><i class="fa-solid fa-user fa-2x"></i>کاربری</a>
            <div class="shopping-icon">
                <a href="./card.html"><i class="fa-solid fa-cart-shopping fa-2x"></i>سبد خرید</i>
                    <span class="cart-badge">0</span>
                </a>
            </div>
            <a href="./allProduct.html"><i class="fa-solid fa-bag-shopping fa-2x"></i>محصولات</a>
            <a href="./index.html"><i class="fa-solid fa-house fa-2x"></i>خانه</a>
        </nav>
    </section>
    
    
    <section id="categories">
        <div class="container category-wrap">
        <h2>دسته بندی محصولات</h2>
        <div class="category-list">
            <button class="category-btn" data-category="all">همه</button>
            <button class="category-btn" data-category="jewelery">جواهرات</button>
            <button class="category-btn" data-category="men's clothing">مردانه</button>
            <button class="category-btn" data-category="women's clothing">زنانه</button>
            <button class="category-btn" data-category="electronics">کالای دیجیتال</button>
        </div>
        </div>
    </section>

    <section id="product-filter">
        <div class="container wrap-filter">
                <div class="product-heading">
            <h4>همه محصولات</h4>
            <p class="product-count"></p>
        </div>
        <div class="filter-list">
            <div class="dropdown">
                <button class="filter-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">ترتیب نمایش</button>
                <ul class="dropdown-menu">

                    <li>
                        <button class="dropdown-item" type="button" data-sort="cheap">ارزانترین</button>
                    </li>
                    <li>
                        <button class="dropdown-item" type="button" data-sort="expensive">گرانترین</button>
                    </li>
                </ul>
            </div>
            </div>
        </div>
    </section>

    <section id="product-section">

        <div id="products-container" class="products-grid"></div>
    </section>












    <script src="./js/allProduct.js"></script>
    <script src="./js/samedata.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>

</html>
