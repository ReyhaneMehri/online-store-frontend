<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/login.css" rel="stylesheet">
    <link href="./css/all.min.css" rel="stylesheet">
    <link href="./css/responsive.css" rel="stylesheet">
</head>

<body>
    <section id="enter">
        <div class="container">

            <div class="wrapper">

                <div class="login-side">
                    <div class="login">
                        <h2>ورود</h2>
                        <form id="login-form" class="needs-validation" novalidate>
                            <div class="form-floating inputs-width">
                                <input type="email" class="form-control" id="login-email" name="login-email" placeholder="name@example.com"
                                    required>
                                <label for="login-email">ایمیل</label>
                                <div class="invalid-feedback">
                                    ایمیل رو وارد کن مشتی
                                </div>
                            </div>
                            <div class="form-floating inputs-width">
                                <input type="password" class="form-control" id="login-password" name="login-password" placeholder="Password"
                                    required>
                                <label for="login-password">رمز</label>
                                <div class="invalid-feedback">
                                    رمزو بزن
                                </div>
                                <a href="#">
                                    <p>رمزت رو فراموش کردی؟</p>
                                </a>
                            </div>
                            <button class="login-info-btn" type="submit">ارسال</button>
                            <div id="message-login"></div>
                        </form>
                    </div>
                </div>
                <form id="register-form" class="needs-validation" novalidate>
                    <div class="register-side">
                        <div class="register-panel">
                            <h2>ثبت نام</h2>

                            <div class="form-floating inputs-width">
                                <input type="email" class="form-control" id="register-email"
                                    placeholder="name@example.com" name="email" required>
                                <label for="register-email">ایمیل</label>
                                <div class="invalid-feedback">
                                    ایمیل رو وارد کن مشتی
                                </div>
                            </div>
                            <div class="form-floating inputs-width">
                                <input type="password" class="form-control" id="register-password"
                                    placeholder="Password" name="password" required>
                                <label for="register-password">رمز</label>
                                <div class="invalid-feedback">
                                    رمز رو وارد کن مشتی
                                </div>
                            </div>
                            <div class="form-floating inputs-width">
                                <input type="password" class="form-control" id="register-confirm-password"
                                    placeholder="Password" name="confirm" required>
                                <label for="register-confirm-password">تکرار رمز</label>
                                <div class="invalid-feedback">
                                    یبار دیگه رمزو بزن
                                </div>
                            </div>
                            <button class="register-info-btn" type="submit">ارسال</button>
                            <div id="message"></div>
                        </div>
                    </div>
                </form>
                <div class="curve ">
                    <div class="login-message">
                        <h2>میخوای وارد پنل بشی؟</h2>
                        <button class="login-btn">ورود</button>
                    </div>
                    <div class="signin-message">
                        <h2>هنوز نیومدی به جمع ما؟</h2>

                        <button class="register-btn">ثبت نام</button>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="./js/login.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>

</html>
